<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student GPA Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student GPA Calculator</h1>

        <p class="subtitle">
            Calculate your GPA easily by entering your courses, credits, and grades.
        </p>

        <div id="courses">

            <div class="course">
                <input type="text" placeholder="Subject">

                <input type="number" placeholder="Credits" min="1">

                <select>
                    <option value="">Grade</option>
                    <option value="4.0">A</option>
                    <option value="3.7">A-</option>
                    <option value="3.3">B+</option>
                    <option value="3.0">B</option>
                    <option value="2.7">B-</option>
                    <option value="2.3">C+</option>
                    <option value="2.0">C</option>
                    <option value="1.7">C-</option>
                    <option value="1.3">D+</option>
                    <option value="1.0">D</option>
                    <option value="0.0">F</option>
                </select>
            </div>

        </div>

        <div class="buttons">

            <button onclick="addCourse()">
                + Add Course
            </button>

            <button onclick="calculateGPA()">
                Calculate GPA
            </button>

            <button onclick="resetCalculator()" class="reset">
                Reset
            </button>

        </div>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
